services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: legalai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: legalai-frontend

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped