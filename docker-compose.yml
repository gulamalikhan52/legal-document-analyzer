services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: legalai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: legalai-frontend

    command: >
      uv run streamlit run app/frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000/ask

    depends_on:
      - backend

    restart: unless-stopped
